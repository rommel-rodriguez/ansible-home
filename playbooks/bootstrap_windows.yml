---
- name: Bootstrap Windows hosts for Ansible
  hosts: windows_all
  gather_facts: false
  serial: 1
  collections:
    - ansible.windows
    - community.windows

  vars:
    bootstrap_user: ansible
    bootstrap_group: Administrators
    bootstrap_pubkey_path: "{{ lookup('env', 'HOME') ~ '/.ssh/id_ansible.pub' }}"
    bootstrap_password: "{{ bootstrap_password | default(lookup('env', 'ANSIBLE_BOOTSTRAP_PASSWORD')) }}"
    ssh_authorized_key_path: "C:\\Users\\{{ bootstrap_user }}\\.ssh\\authorized_keys"

  pre_tasks:
    - name: Ensure a bootstrap password was provided
      ansible.builtin.assert:
        that:
          - (bootstrap_password | default('')) | length > 0
        fail_msg: >
          Provide bootstrap_password via --extra-vars or the ANSIBLE_BOOTSTRAP_PASSWORD environment variable.
      tags: [bootstrap]

    - name: Gather facts after WinRM becomes available
      ansible.windows.setup:
      tags: [bootstrap]

  tasks:
    - name: Ensure OpenSSH capability installed: {{ item }}
      ansible.windows.win_shell: |
        $capName = '{{ item }}'
        $capability = Get-WindowsCapability -Online -Name $capName -ErrorAction Stop
        if ($capability.State -eq 'Installed') {
          Write-Output 'capability-installed=false'
          exit 0
        }
        Add-WindowsCapability -Online -Name $capName -ErrorAction Stop | Out-Null
        Write-Output 'capability-installed=true'
      args:
        executable: PowerShell
      loop:
        - OpenSSH.Client~~~~0.0.1.0
        - OpenSSH.Server~~~~0.0.1.0
      loop_control:
        label: "{{ item }}"
      changed_when: "'capability-installed=true' in stdout"
      tags: [bootstrap, openssh]

    - name: Ensure sshd service is running and enabled
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started
      tags: [bootstrap, openssh]

    - name: Make sure the OpenSSH firewall rule is enabled
      community.windows.win_firewall_rule:
        name: OpenSSH-Server-In-TCP
        state: present
        enable: true
        direction: In
        action: Allow
      tags: [bootstrap, openssh]

    - name: Ensure automation user exists with admin rights
      ansible.windows.win_user:
        name: "{{ bootstrap_user }}"
        password: "{{ bootstrap_password }}"
        groups:
          - "{{ bootstrap_group }}"
        update_password: on_create
        user_cannot_change_password: true
        password_never_expires: true
        account_disabled: false
        state: present
      tags: [bootstrap, user]

    - name: Create the .ssh directory for the automation user
      ansible.windows.win_file:
        path: "C:\\Users\\{{ bootstrap_user }}\\.ssh"
        state: directory
      tags: [bootstrap, ssh]

    - name: Deploy the automation public key
      ansible.windows.win_copy:
        content: "{{ lookup('file', bootstrap_pubkey_path) }}"
        dest: "{{ ssh_authorized_key_path }}"
      tags: [bootstrap, ssh]

    - name: Remove inherited ACLs from authorized_keys
      ansible.windows.win_acl_inheritance:
        path: "{{ ssh_authorized_key_path }}"
        state: absent
      tags: [bootstrap, ssh]

    - name: Grant SYSTEM read access to authorized_keys
      ansible.windows.win_acl:
        path: "{{ ssh_authorized_key_path }}"
        user: SYSTEM
        rights: Read
        type: allow
        state: present
      tags: [bootstrap, ssh]

    - name: Grant the automation user full control of authorized_keys
      ansible.windows.win_acl:
        path: "{{ ssh_authorized_key_path }}"
        user: "{{ bootstrap_user }}"
        rights: FullControl
        type: allow
        state: present
      tags: [bootstrap, ssh]
